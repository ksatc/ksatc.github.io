# アプリごとのサイト設定。キーは _config.yml の defaults で各ディレクトリに割り当てる `app:` の値。
# home: マストヘッドのタイトルのリンク先 / nav: ヘッダーナビ

circleScope:
  title: CircleScope
  title_separator: "Mac用コミケカタログ | CircleScope"
  description: >-
    Mac用コミケカタログ閲覧アプリ CircleScope の公式サイトです。
    サークル検索、お気に入り管理、マップビューなど便利な機能を搭載。
  home: /circleScope/
  og_image: /circleScope/assets/images/app_top.png
  author:
    name: "CircleScope Team"
    bio: "Mac用コミケカタログ閲覧アプリの開発チーム"
  nav:
    - title: "ホーム"
      url: /circleScope/
    - title: "FAQ"
      url: /circleScope/faq/
    - title: "サポート"
      url: /circleScope/support/

circlecheck:
  title: CircleCheck
  title_separator: "コミケカタログチェックアプリ | CircleCheck"
  description: >-
    iPhone用コミケカタログチェックアプリ CircleCheck の公式サイトです。
    オフラインチェック、疲れない一覧表示、Pixiv/Twitter連携など便利な機能を搭載。
  home: /circlecheck/
  og_image: /circlecheck/assets/images/header.png
  author:
    name: "CircleCheck 開発チーム"
    bio: "コミケカタログチェックアプリの開発チーム"
  nav:
    - title: "ホーム"
      url: /circlecheck/
    - title: "プライバシーポリシー"
      url: /circlecheck/privacy.html

