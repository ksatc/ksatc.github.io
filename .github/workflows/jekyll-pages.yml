name: Deploy Jekyll sites to Pages

on:
  push:
    branches: ["master"]
    paths:
      - 'circleScope/**'
      - 'circlemap2/**'
      - 'circlecheck/**'
      - 'circlemap/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Build CircleScope with Jekyll
        run: |
          cd circleScope
          bundle install
          bundle exec jekyll build --baseurl "/circleScope"
        env:
          JEKYLL_ENV: production

      - name: Build CircleMap2 with Jekyll
        run: |
          cd circlemap2
          bundle install
          bundle exec jekyll build --baseurl "/circlemap2"
        env:
          JEKYLL_ENV: production

      - name: Build CircleCheck with Jekyll
        run: |
          cd circlecheck
          bundle install
          bundle exec jekyll build --baseurl "/circlecheck"
        env:
          JEKYLL_ENV: production

      - name: Build CircleMap with Jekyll
        run: |
          cd circlemap
          bundle install
          bundle exec jekyll build --baseurl "/circlemap"
        env:
          JEKYLL_ENV: production

      - name: Prepare deployment directory
        run: |
          # 既存のファイル構造をコピー
          mkdir -p _deploy
          cp -r kantimer _deploy/ 2>/dev/null || true
          cp -r css _deploy/ 2>/dev/null || true
          cp index.html _deploy/ 2>/dev/null || true
          cp app-ads.txt _deploy/ 2>/dev/null || true

          # Jekyllサイトを追加
          mkdir -p _deploy/circleScope
          cp -r circleScope/_site/* _deploy/circleScope/

          mkdir -p _deploy/circlemap2
          cp -r circlemap2/_site/* _deploy/circlemap2/

          mkdir -p _deploy/circlecheck
          cp -r circlecheck/_site/* _deploy/circlecheck/

          mkdir -p _deploy/circlemap
          cp -r circlemap/_site/* _deploy/circlemap/

      - name: Debug - List deployment directory
        run: |
          echo "=== Deployment directory structure ==="
          ls -la _deploy/
          echo "=== CircleScope directory ==="
          ls -la _deploy/circleScope/ || echo "circleScope directory not found"
          echo "=== CircleMap2 directory ==="
          ls -la _deploy/circlemap2/ || echo "circlemap2 directory not found"
          echo "=== CircleCheck directory ==="
          ls -la _deploy/circlecheck/ || echo "circlecheck directory not found"
          echo "=== CircleMap directory ==="
          ls -la _deploy/circlemap/ || echo "circlemap directory not found"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy

  deploy:
    environment:
      name: github-pages
      url: https://ksatc.github.io/
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
